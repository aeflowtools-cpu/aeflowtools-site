<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>UI Flow Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    body { overflow-x: hidden; }
    .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px 18px 80px; }

    /* gate */
    .gate { min-height: 78vh; display: flex; align-items: center; justify-content: center; }
    .gate-card { width: 100%; max-width: 360px; text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(20px) saturate(140%); border: 1px solid var(--border); border-radius: 22px; padding: 40px 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08); }
    .gate-card h1 { font-size: 22px; font-weight: 800; margin: 14px 0 8px; }
    .gate-card p { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    .gate-card input { width: 100%; padding: 13px 14px; border-radius: 12px; margin-bottom: 14px; text-align: center;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 15px; outline: none; }
    .gate-card input:focus { border-color: var(--accent-2); }
    .gate-card .btn { width: 100%; justify-content: center; }
    .err { color: #f87171; font-size: 13px; min-height: 18px; margin-top: 10px; }

    /* header + tabs */
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
    .top h1 { font-size: 22px; font-weight: 800; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
    .tab { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.03);
      color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .tab:hover { color: var(--text); }
    .tab.active { color: #fff; background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-color: transparent; }
    .lock-btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05);
      color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .lock-btn:hover { color: var(--text); }

    /* stat cards */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .nu-date { padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 14px; outline: none; color-scheme: dark; cursor: pointer; }
    .nu-date:focus { border-color: var(--accent-2); }
    .stat { background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
    .stat .n { font-size: 30px; font-weight: 900; letter-spacing: -0.02em; }
    .stat .l { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* toolbar */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .toolbar input.search { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
    .toolbar input.search:focus { border-color: var(--accent-2); }
    .chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.03);
      color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .chip.active { color: #fff; background: rgba(37,99,235,0.25); border-color: rgba(37,99,235,0.5); }

    /* tables */
    .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; white-space: nowrap; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; background: rgba(255,255,255,0.02); position: sticky; top: 0; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    td.wrap-cell { white-space: normal; word-break: break-word; max-width: 260px; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .b-vip { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .b-paid { background: rgba(37,99,235,0.18); color: #60a5fa; }
    .b-bd { background: rgba(34,197,94,0.15); color: #4ade80; }
    .b-free { background: rgba(148,163,184,0.12); color: #cbd5e1; }
    .b-rev { background: rgba(248,113,113,0.15); color: #f87171; }
    .rowbtn { padding: 4px 9px; border-radius: 7px; border: 1px solid var(--border); background: none; color: var(--muted);
      font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; margin-right: 4px; }
    .rowbtn:hover { color: var(--text); border-color: var(--accent-2); }
    .rowbtn.danger:hover { color: #f87171; border-color: rgba(248,113,113,0.5); }
    .muted { color: var(--faint); }

    /* forms / cards */
    .card { background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px; margin-bottom: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
    .card h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .card .desc { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fld { margin-bottom: 12px; }
    .fld label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .fld input[type=text], .fld input[type=email], .fld input[type=number], .fld input[type=url], .fld select, .fld textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent-2); }
    .fld textarea { resize: vertical; min-height: 60px; }
    .fld.chk { display: flex; align-items: center; gap: 8px; }
    .fld.chk input { width: 18px; height: 18px; }
    .fld.chk label { margin: 0; }
    .rowbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
    .note { color: var(--faint); font-size: 12px; }
    .save-status { font-size: 13px; margin-left: 8px; }
    .save-status.ok { color: #4ade80; } .save-status.err { color: #f87171; }
    .subtabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .popup-card { border: 1px dashed var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; position: relative; }
    .popup-card .del-popup { position: absolute; top: 10px; right: 10px; }
    /* collapsible list (promo banners / popups) */
    .item { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: rgba(255,255,255,0.03); }
    .item-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; user-select: none; }
    .item-head:hover { background: rgba(255,255,255,0.04); }
    .item-head .ico { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
    .item.open .item-head .ico { transform: rotate(90deg); }
    .item-head .ttl { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-head .stat { font-size: 11px; font-weight: 700; padding: 3px 11px; border-radius: 999px; flex-shrink: 0; }
    .stat.on { background: rgba(34,197,94,0.15); color: #4ade80; }
    .stat.off { background: rgba(148,163,184,0.12); color: #94a3b8; }
    .item-body { display: none; padding: 6px 16px 16px; border-top: 1px solid var(--border); }
    .item.open .item-body { display: block; }
    .item-head .prio { font: 700 11px ui-monospace, monospace; color: var(--accent-2); flex-shrink: 0;
      background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.3); padding: 2px 8px; border-radius: 999px; }
    .pop-reorder { display: inline-flex; gap: 4px; flex-shrink: 0; }
    .pop-reorder .rowbtn { padding: 2px 9px; margin: 0; line-height: 1.2; font-size: 13px; }
    .pop-reorder .rowbtn:disabled { opacity: 0.28; cursor: default; }
    .pop-import textarea { width: 100%; min-height: 150px; font: 500 12.5px ui-monospace, monospace; }
    tbody tr.clickable { cursor: pointer; }
    /* user profile modal */
    .um-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .um-overlay.open { opacity: 1; pointer-events: auto; }
    .um-modal { position: relative; width: 100%; max-width: 560px; max-height: calc(100vh - 40px); overflow-y: auto;
      background: linear-gradient(180deg, rgba(22,24,30,0.98), rgba(13,14,18,0.99)); border: 1px solid var(--border);
      border-radius: 18px; padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); }
    .um-close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 0; color: var(--text); font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .um-close:hover { background: rgba(255,255,255,0.16); }
    .um-title { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
    .sec-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin: 20px 0 4px; }
    .dl { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    .dl .dk { color: var(--muted); flex-shrink: 0; }
    .dl .dv { text-align: right; word-break: break-word; }
    .dl .dv a { color: var(--accent-2); }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

    /* Downloads dashboard */
    .toolbar select { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 14px; outline: none; cursor: pointer; }
    .toolbar select:focus { border-color: var(--accent-2); }
    .toolbar select option { background: #14161c; color: var(--text); }
    .dl-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    .dl-cols.dl-cols-1 { grid-template-columns: 1fr; }
    @media (max-width: 820px) { .dl-cols { grid-template-columns: 1fr; } }
    .dlbar { display: grid; grid-template-columns: 132px 1fr auto; align-items: center; gap: 12px; padding: 5px 0; font-size: 13px; }
    .dlbar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dlbar-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .dlbar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
    .dlbar-n { color: var(--muted); font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="wrap">
    <!-- GATE -->
    <div class="gate" id="gate">
      <div class="gate-card">
        <div style="font-size:38px;">🛠️</div>
        <h1>UI Flow Admin</h1>
        <p>Enter the admin password.</p>
        <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()" />
        <button class="btn btn-primary" onclick="unlock()">Unlock</button>
        <div class="err" id="gateErr"></div>
      </div>
    </div>

    <!-- APP -->
    <div id="app" style="display:none;">
      <div class="top">
        <h1>🛠️ UI Flow Admin</h1>
        <div style="display:flex; gap:8px;">
          <button class="lock-btn" onclick="render()">↻ Refresh</button>
          <button class="lock-btn" onclick="lock()">🔒 Lock</button>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="view"></div>
    </div>
  </div>

  <!-- user profile modal -->
  <div class="um-overlay" id="userModal">
    <div class="um-modal">
      <button class="um-close" onclick="closeUserModal()">×</button>
      <div id="umBody"></div>
    </div>
  </div>

  <script>
    var TABS = ['Overview', 'Users', 'BD Free', 'Keys', 'VIPs', 'Bugs', 'Reviews', 'Downloads', 'Content'];
    var cur = 'Overview';
    var cache = {};        // data cache per tab
    var userFilter = 'All';
    var contentTab = 'Popups';

    function pw() { return sessionStorage.getItem('admin_pw') || ''; }
    function esc(s) { var d = document.createElement('div'); d.textContent = (s === null || s === undefined) ? '' : String(s); return d.innerHTML; }
    function fmt(ts) { if (!ts) return '—'; try { return new Date(ts).toLocaleString('en-US', { timeZone: 'Asia/Dhaka', dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ts; } }

    async function api(action, extra) {
      var r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ password: pw(), action: action }, extra || {})) });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.error || 'Request failed');
      return d;
    }

    async function unlock() {
      var val = document.getElementById('pw').value;
      var err = document.getElementById('gateErr');
      err.textContent = 'Checking…';
      sessionStorage.setItem('admin_pw', val);
      try {
        await api('ping');
        err.textContent = '';
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        renderTabs(); go('Overview');
      } catch (e) { sessionStorage.removeItem('admin_pw'); err.textContent = e.message; }
    }
    function lock() { sessionStorage.removeItem('admin_pw'); location.reload(); }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = TABS.map(function (t) {
        return '<button class="tab' + (t === cur ? ' active' : '') + '" onclick="go(\'' + t + '\')">' + t + '</button>';
      }).join('');
    }
    function go(t) { cur = t; renderTabs(); render(); }

    function view(html) { document.getElementById('view').innerHTML = html; }
    function loading() { view('<div class="muted" style="padding:30px;text-align:center;">Loading…</div>'); }

    async function render() {
      try {
        if (cur === 'Overview') return renderOverview();
        if (cur === 'Users') return renderUsers();
        if (cur === 'BD Free') return renderBd();
        if (cur === 'Keys') return renderKeys();
        if (cur === 'VIPs') return renderVips();
        if (cur === 'Bugs') return renderBugs();
        if (cur === 'Reviews') return renderReviews();
        if (cur === 'Downloads') return renderDownloads();
        if (cur === 'Content') return renderContent();
      } catch (e) { view('<div class="err" style="padding:20px;">' + esc(e.message) + '</div>'); }
    }

    // ---------- OVERVIEW ----------
    async function renderOverview() {
      loading();
      var d = await api('overview'); var s = d.stats;
      // users list (with first_seen) powers the per-day new-user counter
      if (!cache.users) { try { cache.users = (await api('users')).rows || []; } catch (e) { cache.users = []; } }
      var today = dhakaToday();
      var html = '<div class="stats">' +
        card(s.users, 'Total users') + card(s.paidKeys, 'Active paid keys') + card(s.bd, 'BD free signups') +
        card(s.vips, 'VIPs') + card(s.activeToday, 'Active (24h)') + '</div>' +
        '<div class="card" style="margin-top:18px;">' +
          '<div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;">' +
            '<div><div id="nuCount" style="font-size:clamp(42px,7vw,62px);font-weight:900;letter-spacing:-0.02em;line-height:1;">–</div>' +
            '<div class="l" id="nuLabel" style="color:var(--muted);margin-top:8px;font-size:15px;">new users</div></div>' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
              '<button class="lock-btn" title="Previous day" onclick="nuShift(-1)">◀</button>' +
              '<input type="date" id="nuDate" value="' + today + '" max="' + today + '" onchange="updateNewUsers()" class="nu-date">' +
              '<button class="lock-btn" title="Next day" onclick="nuShift(1)">▶</button>' +
            '</div>' +
          '</div>' +
          '<div class="note" id="nuSub" style="margin-top:14px;"></div>' +
        '</div>';
      view(html);
      updateNewUsers();
      function card(n, l) { return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }
    }
    // ---- per-day new users (Asia/Dhaka calendar days, from app_users.first_seen) ----
    function dhakaDate(ts) {
      if (!ts) return '';
      try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dhaka', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ts)); }
      catch (e) { return String(ts).slice(0, 10); }
    }
    function dhakaToday() { return dhakaDate(new Date().toISOString()); }
    function shiftDate(str, delta) { var d = new Date(str + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + delta); return d.toISOString().slice(0, 10); }
    function prettyDate(str) { try { return new Date(str + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return str; } }
    function newUsersInRange(a, b) { return (cache.users || []).filter(function (u) { var dd = dhakaDate(u.first_seen); return dd && dd >= a && dd <= b; }).length; }
    function updateNewUsers() {
      var el = document.getElementById('nuDate'); if (!el) return;
      var dateStr = el.value || dhakaToday();
      var count = (cache.users || []).filter(function (u) { return dhakaDate(u.first_seen) === dateStr; }).length;
      document.getElementById('nuCount').textContent = count;
      document.getElementById('nuLabel').textContent = 'new users on ' + prettyDate(dateStr);
      var d7 = newUsersInRange(shiftDate(dateStr, -6), dateStr);
      var d30 = newUsersInRange(shiftDate(dateStr, -29), dateStr);
      document.getElementById('nuSub').innerHTML = '7-day total (through this date): <strong>' + d7 + '</strong> &nbsp;·&nbsp; 30-day total: <strong>' + d30 + '</strong>';
    }
    function nuShift(delta) {
      var el = document.getElementById('nuDate'); if (!el) return;
      var next = shiftDate(el.value || dhakaToday(), delta);
      if (next > dhakaToday()) return;   // don't go into the future
      el.value = next;
      updateNewUsers();
    }

    // ---------- USERS ----------
    async function renderUsers() {
      loading();
      var d = await api('users'); cache.users = d.rows || [];
      drawUsers();
    }
    var userOpens = 1;   // minimum opens filter (1 = all users)
    function drawUsers() {
      var filters = ['All', 'VIP', 'Paid', 'BD Free', 'Free', 'Hottest leads'];
      var opensOpts = [1, 2, 3, 4, 5, 10];
      var html = '<div class="toolbar">' +
        '<input class="search" id="uSearch" placeholder="Search name / user id / email / source / country…" oninput="renderUsersResults()">' +
        '<span id="uChips" style="display:flex;gap:6px;flex-wrap:wrap;">' +
        filters.map(function (f) { return '<button class="chip' + (userFilter === f ? ' active' : '') + '" data-f="' + esc(f) + '" onclick="setUserFilter(\'' + f + '\')">' + f + '</button>'; }).join('') +
        '</span>' +
        '<select id="uOpens" onchange="userOpens=parseInt(this.value,10);renderUsersResults()">' +
        opensOpts.map(function (n) { return '<option value="' + n + '"' + (userOpens === n ? ' selected' : '') + '>' + (n === 1 ? 'All opens' : n + '+ opens') + '</option>'; }).join('') +
        '</select>' +
        '<button class="chip" onclick="exportCSV(filteredUsers(),\'users\')">⬇ CSV</button></div>' +
        '<div id="uResults"></div>';
      view(html);
      renderUsersResults();
    }
    function setUserFilter(f) {
      userFilter = f;
      var chips = document.querySelectorAll('#uChips .chip');
      Array.prototype.forEach.call(chips, function (c) { c.classList.toggle('active', c.getAttribute('data-f') === f); });
      renderUsersResults();
    }
    function filteredUsers() {
      var q = (document.getElementById('uSearch') ? document.getElementById('uSearch').value : '').toLowerCase().trim();
      return (cache.users || []).filter(function (u) {
        if (q && (String(u.user_id) + ' ' + (u._name || '') + ' ' + (u._email || '') + ' ' + (u.source || '') + ' ' + (u.country || '') + ' ' + countryName(u.country)).toLowerCase().indexOf(q) < 0) return false;
        if ((u.open_count || 0) < userOpens) return false;
        if (userFilter === 'Hottest leads') return u._status === 'Free' && (u.completed_usage || 0) >= 2;
        if (userFilter !== 'All' && u._status !== userFilter) return false;
        return true;
      });
    }
    function renderUsersResults() {
      var rows = filteredUsers();
      var byCty = countBy(rows, function (u) { return u.country || '—'; });
      var bySrc = countBy(rows, function (u) { return u.source || '—'; });
      var h = '<div class="stats" style="margin:4px 0 18px;">' +
        dlStat(rows.length, 'Users shown') + dlStat(byCty.length, 'Countries') +
        dlStat(rows.filter(function (u) { return u._status === 'Paid'; }).length, 'Paid') +
        dlStat(rows.filter(function (u) { return u._status === 'VIP'; }).length, 'VIPs') + '</div>';
      h += '<div class="dl-cols">' + dlBars('Top countries 🌍', byCty, rows.length, true) + dlBars('Top sources 📱', bySrc, rows.length, false) + '</div>';
      h += '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>User ID</th><th>Status</th><th>Country</th><th>Source</th><th>Opens</th><th>Days maxed</th><th>Last seen</th></tr></thead><tbody>';
      h += rows.slice(0, 1000).map(function (u) {
        var nm = u._name || (u._email || '—');

    // ---------- DOWNLOADS ----------
    var _regionNames = null;
    try { _regionNames = new Intl.DisplayNames(['en'], { type: 'region' }); } catch (e) {}
    function countryName(code) {
      if (!code) return '—';
      var c = String(code).toUpperCase();
      if (_regionNames) { try { var n = _regionNames.of(c); if (n && n !== c) return n; } catch (e) {} }
      return c;
    }
    function flagEmoji(code) {
      if (!code || String(code).length !== 2) return '';
      return String(code).toUpperCase().replace(/./g, function (ch) { return String.fromCodePoint(0x1F1E6 + ch.charCodeAt(0) - 65); });
    }
    function countBy(arr, keyFn) {
      var m = {};
      arr.forEach(function (r) { var k = keyFn(r); m[k] = (m[k] || 0) + 1; });
      return Object.keys(m).map(function (k) { return { k: k, n: m[k] }; }).sort(function (a, b) { return b.n - a.n; });
    }
    function uniqSorted(arr) { var s = {}, o = []; arr.forEach(function (x) { if (!s[x]) { s[x] = 1; o.push(x); } }); return o.sort(); }
    function dlStat(n, l) { return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }

    async function renderDownloads() {
      loading();
      cache.downloads = (await api('downloads')).rows || [];
      drawDownloads();
    }
    function drawDownloads() {
      var all = cache.downloads || [];
      if (!all.length) { view('<div class="muted" style="padding:30px;text-align:center;">No downloads recorded yet.</div>'); return; }
      var ctyOpts = ['All'].concat(uniqSorted(all.map(function (r) { return r.country || '—'; })));
      var html = '<div class="toolbar">' +
        '<input class="search" id="dlSearch" placeholder="Search country / version…" oninput="renderDlResults()">' +
        '<select id="dlCty" onchange="renderDlResults()">' + ctyOpts.map(function (o) {
          return '<option value="' + esc(o) + '">' + (o === 'All' ? 'All countries' : (o === '—' ? '(not recorded)' : esc(flagEmoji(o) + ' ' + countryName(o)))) + '</option>';
        }).join('') + '</select>' +
        '<button class="chip" onclick="exportCSV(filteredDownloads(),\'download_clicks\')">⬇ CSV</button></div>' +
        '<div id="dlResults"></div>';
      view(html);
      renderDlResults();
    }
    function filteredDownloads() {
      var q = (document.getElementById('dlSearch') ? document.getElementById('dlSearch').value : '').toLowerCase().trim();
      var fc = document.getElementById('dlCty') ? document.getElementById('dlCty').value : 'All';
      return (cache.downloads || []).filter(function (r) {
        if (fc !== 'All' && (r.country || '—') !== fc) return false;
        if (q) {
          var hay = ((r.country || '') + ' ' + countryName(r.country) + ' ' + (r.button || '')).toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
    }
    function dlBars(title, items, total, isCountry) {
      var max = items.length ? items[0].n : 1;
      var body = items.slice(0, 12).map(function (it) {
        var label = it.k === '—' ? '<span class="muted">(not recorded)</span>'
          : (isCountry ? esc(flagEmoji(it.k) + ' ' + countryName(it.k)) : esc(it.k));
        var pct = total ? Math.round(it.n / total * 100) : 0;
        var w = max ? Math.max(4, Math.round(it.n / max * 100)) : 0;
        return '<div class="dlbar"><div class="dlbar-label">' + label + '</div>' +
          '<div class="dlbar-track"><div class="dlbar-fill" style="width:' + w + '%"></div></div>' +
          '<div class="dlbar-n">' + it.n + ' · ' + pct + '%</div></div>';
      }).join('') || '<div class="muted" style="padding:8px 0;">No data.</div>';
      return '<div class="card"><h3 style="margin-bottom:14px;">' + title + '</h3>' + body +
        (items.length > 12 ? '<div class="note" style="margin-top:8px;">+ ' + (items.length - 12) + ' more</div>' : '') + '</div>';
    }
    function renderDlResults() {
      var all = cache.downloads || [];
      var rows = filteredDownloads();
      var byCty = countBy(rows, function (r) { return r.country || '—'; });
      var h = '<div class="stats" style="margin:4px 0 18px;">' +
        dlStat(rows.length, 'Downloads shown') + dlStat(all.length, 'All-time downloads') +
        dlStat(byCty.length, 'Countries') + '</div>';
      h += '<div class="dl-cols dl-cols-1">' + dlBars('Top countries 🌍', byCty, rows.length, true) + '</div>';
      h += '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Version</th><th>Country</th></tr></thead><tbody>';
      h += rows.slice(0, 500).map(function (r) {
        return '<tr><td>' + fmt(r.created_at) + '</td><td class="muted">' + esc(r.button || '') + '</td>' +
          '<td>' + (r.country ? esc(flagEmoji(r.country) + ' ' + countryName(r.country)) : '<span class="muted">—</span>') + '</td></tr>';
      }).join('') || '<tr><td colspan="3" class="muted" style="text-align:center;padding:24px;">No downloads match.</td></tr>';
      h += '</tbody></table></div><div class="note" style="margin-top:8px;">' + rows.length + ' shown' +
        (rows.length > 500 ? ' · table capped at 500 (breakdown counts all matches)' : '') + '</div>';
      document.getElementById('dlResults').innerHTML = h;
    }

      var html = '<div class="subtabs">' + subs.map(function (s) { return '<button class="tab' + (contentTab === s ? ' active' : '') + '" onclick="contentTab=\'' + s + '\';renderContent()">' + s + '</button>'; }).join('') + '</div><div id="cbody"><div class="muted" style="padding:20px;">Loading…</div></div>';
      view(html);
      var fn = contentTab === 'Popups' ? loadPopups : contentTab === 'Promo' ? loadPromo : contentTab === 'Offer' ? loadOffer : loadConfig;
      fn().catch(function (e) { cbody('<div class="err" style="padding:16px;">' + esc(e.message) + '</div>'); });
    }
    function cbody(h) { document.getElementById('cbody').innerHTML = h; }
    var REGION_NOTE = 'Region: <code>all</code> · <code>international</code> · <code>bd</code> · a country code like <code>IN</code> · or a list <code>IN,PK</code>.';

    // collapsible list item: title + active badge in the head, full form in the (hidden) body
    function item(i, title, active, body) {
      var t = (title && String(title).trim()) || 'Untitled';
      return '<div class="item"><div class="item-head" onclick="toggleItem(this)">' +
        '<span class="ico">▸</span><span class="ttl">' + esc(t) + '</span>' +
        '<span class="stat ' + (active ? 'on' : 'off') + '">' + (active ? 'Active' : 'Off') + '</span></div>' +
        '<div class="item-body">' + body + '</div></div>';
    }
    function toggleItem(head) { head.parentElement.classList.toggle('open'); }
    function updHead(chk) { var s = chk.closest('.item').querySelector('.item-head .stat'); s.className = 'stat ' + (chk.checked ? 'on' : 'off'); s.textContent = chk.checked ? 'Active' : 'Off'; }
    function updTitle(inp) { inp.closest('.item').querySelector('.item-head .ttl').textContent = (inp.value.trim() || 'Untitled'); }

    async function loadConfig() {
      var c = (await api('get_content', { file: 'config.json' })).content || {};
      var t = c.tutorial || {};
      cbody('<div class="card"><h3>Daily free-export limit</h3><div class="desc">How many free exports per 24h before a free user is blocked.</div>' +
        '<div class="fld" style="max-width:220px;"><label>freeLimit</label><input type="number" id="cfg_limit" value="' + esc(c.freeLimit != null ? c.freeLimit : 10) + '"></div></div>' +
        '<div class="card"><h3>Tutorial button</h3><div class="desc">The “Watch Tutorial” link shown in the plugin.</div>' +
        '<div class="fld chk"><input type="checkbox" id="cfg_tut_enabled" ' + (t.enabled ? 'checked' : '') + '><label>Enabled</label></div>' +
        '<div class="fld"><label>URL</label><input type="url" id="cfg_tut_url" value="' + esc(t.url || '') + '" placeholder="https://www.youtube.com/@uiflow.plugin"></div>' +
        '<div class="fld"><label>Tooltip</label><input type="text" id="cfg_tut_tooltip" value="' + esc(t.tooltip || '') + '" placeholder="Watch Tutorial"></div>' +
        '<div class="rowbar"><button class="btn btn-primary" onclick="saveConfig()">Save</button><span class="save-status" id="cStatus"></span></div></div>');
    }
    async function saveConfig() {
      await saveFile('config.json', {
        freeLimit: parseInt(document.getElementById('cfg_limit').value || '10', 10),
        tutorial: {
          enabled: document.getElementById('cfg_tut_enabled').checked,
          url: document.getElementById('cfg_tut_url').value.trim(),
          tooltip: document.getElementById('cfg_tut_tooltip').value.trim()
        }
      }, 'cStatus');
    }

    async function loadOffer() {
      var o = (await api('get_content', { file: 'offer.json' })).content || {};
      cbody('<div class="card"><h3>Offer (paid / non-BD users)</h3><div class="desc">Discount shown near "Buy License". Hidden for Bangladesh.</div>' +
        '<div class="fld chk"><input type="checkbox" id="of_active" ' + (o.active ? 'checked' : '') + '><label>Active</label></div>' +
        '<div class="grid2"><div class="fld"><label>Code</label><input type="text" id="of_code" value="' + esc(o.code || '') + '"></div>' +
        '<div class="fld"><label>Discount (%)</label><input type="number" id="of_disc" value="' + esc(o.discount != null ? o.discount : 0) + '"></div></div>' +
        '<div class="fld"><label>Text</label><input type="text" id="of_text" value="' + esc(o.text || '') + '"></div>' +
        '<div class="rowbar"><button class="btn btn-primary" onclick="saveOffer()">Save</button><span class="save-status" id="cStatus"></span></div></div>');
    }
    async function saveOffer() {
      await saveFile('offer.json', { active: document.getElementById('of_active').checked, code: document.getElementById('of_code').value.trim(),
        discount: parseInt(document.getElementById('of_disc').value || '0', 10), text: document.getElementById('of_text').value.trim() }, 'cStatus');
    }

    var promoBanners = [];
    async function loadPromo() {
      var c = (await api('get_content', { file: 'promo.json' })).content || {};
      promoBanners = (c.banners || []).slice();
      drawPromo();
    }
    function drawPromo() {
      var html = '<div class="card"><h3>Promotions banners</h3><div class="desc">Click a banner title to edit it. ' + REGION_NOTE + '</div>';
      html += promoBanners.map(function (b, i) {
        var body =
          '<div class="fld"><label>Title / label (for you)</label><input type="text" data-i="' + i + '" data-k="title" value="' + esc(b.title || '') + '" oninput="updTitle(this)" placeholder="e.g. India tutorial banner"></div>' +
          '<div class="grid2">' +
          '<div class="fld chk"><input type="checkbox" data-i="' + i + '" data-k="active" ' + (b.active ? 'checked' : '') + ' onchange="updHead(this)"><label>Active</label></div>' +
          '<div class="fld chk"><input type="checkbox" data-i="' + i + '" data-k="dismissible" ' + (b.dismissible ? 'checked' : '') + '><label>Dismissible</label></div>' +
          txt(i, 'region', 'Region', b.region || 'all', 'all / international / bd / india / IN') + aud(i, b.audience || 'all') +
          '</div>' +
          '<div class="fld"><label>Text</label><input type="text" data-i="' + i + '" data-k="text" value="' + esc(b.text || '') + '"></div>' +
          '<div class="grid2">' + txt(i, 'url', 'URL', b.url || '') + txt(i, 'image', 'Image/GIF URL (optional — shows instead of text)', b.image || '') + '</div>' +
          '<div class="fld chk"><input type="checkbox" data-i="' + i + '" data-k="time" ' + (b.time ? 'checked' : '') + '><label>⏰ Only show during a daily time window</label></div>' +
          '<div class="grid2">' + tm(i, 'start', 'Start time', b.start || '') + tm(i, 'end', 'End time', b.end || '') + '</div>' +
          '<div class="fld chk"><input type="checkbox" data-i="' + i + '" data-k="date" ' + (b.date ? 'checked' : '') + '><label>📅 Only show between these dates</label></div>' +
          '<div class="grid2">' + dt(i, 'startDate', 'Start date', b.startDate || '') + dt(i, 'endDate', 'End date', b.endDate || '') + '</div>' +
          '<div class="grid2">' + txt(i, 'bg', 'Background', b.bg || '', '#10233f') + txt(i, 'border', 'Border', b.border || '', '#3b82f6') + txt(i, 'color', 'Text color', b.color || '', '#bfdbfe') + '</div>' +
          '<div class="rowbar"><button class="rowbtn danger" onclick="delPromo(' + i + ')">✕ Delete banner</button></div>';
        return item(i, b.title, b.active, body);
      }).join('') || '<div class="muted" style="padding:12px 0;">No banners yet.</div>';
      html += '<div class="rowbar"><button class="rowbtn" onclick="addPromo()">+ Add banner</button><button class="btn btn-primary" onclick="savePromo()">Save all</button><span class="save-status" id="cStatus"></span></div></div>';
      cbody(html);
      function txt(i, k, l, v, p) { return '<div class="fld"><label>' + l + '</label><input type="text" data-i="' + i + '" data-k="' + k + '" value="' + esc(v) + '" placeholder="' + (p || '') + '"></div>'; }
      function tm(i, k, l, v) { return '<div class="fld"><label>' + l + '</label><input type="time" data-i="' + i + '" data-k="' + k + '" value="' + esc(v) + '"></div>'; }
      function dt(i, k, l, v) { return '<div class="fld"><label>' + l + '</label><input type="date" data-i="' + i + '" data-k="' + k + '" value="' + esc(v) + '"></div>'; }
      function aud(i, v) { return '<div class="fld"><label>Audience</label><select data-i="' + i + '" data-k="audience">' + ['all', 'free', 'licensed'].map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>'; }
    }
    function collectPromo() {
      var by = {};
      promoBanners.forEach(function (_, i) { by[i] = {}; });
      document.getElementById('cbody').querySelectorAll('[data-i]').forEach(function (el) {
        by[el.getAttribute('data-i')][el.getAttribute('data-k')] = el.type === 'checkbox' ? el.checked : el.value;
      });
      return Object.keys(by).map(function (i) {
        var o = by[i];
        var out = { active: !!o.active, region: (o.region || 'all').trim(), audience: o.audience || 'all',
          time: !!o.time, start: o.start || '', end: o.end || '',
          date: !!o.date, startDate: o.startDate || '', endDate: o.endDate || '',
          url: (o.url || '').trim(), bg: (o.bg || '').trim(), border: (o.border || '').trim(), color: (o.color || '').trim(),
          dismissible: !!o.dismissible };
        if (o.title && o.title.trim()) out.title = o.title.trim();
        if (o.text && o.text.trim()) out.text = o.text;
        if (o.image && o.image.trim()) out.image = o.image.trim();
        return out;
      });
    }
    function addPromo() { promoBanners = collectPromo(); promoBanners.push({ active: false, region: 'all', audience: 'all', time: false, date: false, start: '', end: '', startDate: '', endDate: '', text: '', url: '' }); drawPromo(); }
    function delPromo(i) { promoBanners = collectPromo(); promoBanners.splice(i, 1); drawPromo(); }
    async function savePromo() { await saveFile('promo.json', { banners: collectPromo() }, 'cStatus'); }

    var popups = [];
    async function loadPopups() {
      var c = (await api('get_content', { file: 'bdpopup.json' })).content || {};
      popups = (c.popups || []).slice();
      drawPopups();
    }
    function drawPopups() {
      var html = '<div class="card"><h3>Launch popups</h3><div class="desc">Shown to unlicensed users when the plugin opens. ' +
        'They run in <strong>priority order</strong> — the popup at the top (#1) shows first; use the ▲▼ buttons to reorder. ' +
        '<code>Max opens</code> caps how many times each popup shows to one user (blank = every open). ' +
        'A popup can be a <code>video</code>, an image/GIF, or a text card. <code>users</code> (client ids) override region. ' + REGION_NOTE + '</div>';
      html += popups.map(function (p, i) {
        var body =
          '<div class="fld"><label>Title <span class="note">(shown on text popups; leave blank for a video-only popup)</span></label><input type="text" data-i="' + i + '" data-k="title" value="' + esc(p.title || '') + '" oninput="updTitle(this)" placeholder="Popup title"></div>' +
          '<div class="fld chk"><input type="checkbox" data-i="' + i + '" data-k="active" ' + (p.active ? 'checked' : '') + ' onchange="updHead(this)"><label>Active</label></div>' +
          '<div class="grid2">' +
          pf(i, 'region', 'Region', p.region || 'all', 'all / international / bd / india / IN,PK') +
          aud(i, p.audience || 'all') +
          num(i, 'maxOpens', 'Max opens per user', (p.maxOpens != null ? p.maxOpens : ''), 'blank = unlimited') +
          pf(i, 'users', 'Target user ids (comma-sep, optional)', (Array.isArray(p.users) ? p.users.join(',') : (p.users || '')), 'user_123,uid_abc') +
          '</div>' +
          '<div class="grid2">' +
          pf(i, 'video', 'Video URL (.mp4, optional)', p.video || '', 'https://…/clip.mp4') +
          pf(i, 'gif', 'GIF / image URL (optional)', p.gif || p.image || '', 'https://…/promo.gif') +
          '</div>' +
          '<div class="grid2">' +
          pf(i, 'button', 'Button label', p.button || '', 'Get My Free Key') +
          pf(i, 'url', 'Button URL', p.url || '', 'https://…') +
          '</div>' +
          '<div class="grid2">' +
          dt(i, 'starts', 'Starts (optional)', p.starts || '') +
          dt(i, 'expires', 'Expires (optional)', p.expires || '') +
          '</div>' +
          '<div class="grid2">' +
          pf(i, 'bg', 'Background', p.bg || '', '#10233f') +
          pf(i, 'border', 'Border', p.border || '', '#3b82f6') +
          pf(i, 'color', 'Text color', p.color || '', '#ffffff') +
          '</div>' +
          '<div class="fld"><label>Text</label><textarea data-i="' + i + '" data-k="text">' + esc(p.text || '') + '</textarea></div>' +
          '<div class="rowbar"><button class="rowbtn danger" onclick="delPopup(' + i + ')">✕ Delete popup</button></div>';
        return popupItem(i, p, body);
      }).join('') || '<div class="muted" style="padding:12px 0;">No popups yet.</div>';
      html += '<div class="rowbar"><button class="rowbtn" onclick="addPopup()">+ Add popup</button>' +
        '<button class="rowbtn" onclick="toggleImport()">⤵ Import / paste JSON</button>' +
        '<button class="btn btn-primary" onclick="savePopups()">Save all</button><span class="save-status" id="cStatus"></span></div>' +
        '<div id="popImport" class="pop-import" style="display:none; margin-top:14px;">' +
        '<div class="fld"><label>Paste a full <code>bdpopup.json</code> — “Load into editor” replaces the list above (nothing is saved until you click “Save all”)</label>' +
        '<textarea id="popImportText" placeholder=\'{ "popups": [ … ] }\'></textarea></div>' +
        '<div class="rowbar"><button class="rowbtn" onclick="importPopups()">Load into editor</button></div></div>' +
        '</div>';
      cbody(html);
      function pf(i, k, label, val, ph) { return '<div class="fld"><label>' + label + '</label><input type="text" data-i="' + i + '" data-k="' + k + '" value="' + esc(val) + '" placeholder="' + (ph || '') + '"></div>'; }
      function num(i, k, label, val, ph) { return '<div class="fld"><label>' + label + '</label><input type="number" min="1" data-i="' + i + '" data-k="' + k + '" value="' + esc(val) + '" placeholder="' + (ph || '') + '"></div>'; }
      function dt(i, k, label, val) { return '<div class="fld"><label>' + label + '</label><input type="date" data-i="' + i + '" data-k="' + k + '" value="' + esc(val) + '"></div>'; }
      function aud(i, v) { return '<div class="fld"><label>Audience</label><select data-i="' + i + '" data-k="audience">' + ['all', 'unlicensed', 'licensed'].map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>'; }
    }
    // popup list item with priority number + reorder controls in the head
    function popupItem(i, p, body) {
      var t = (p.title && String(p.title).trim()) || (p.video ? '🎬 Video popup' : (p.gif || p.image ? '🖼️ Image popup' : 'Untitled'));
      var last = popups.length - 1;
      return '<div class="item"><div class="item-head" onclick="toggleItem(this)">' +
        '<span class="ico">▸</span>' +
        '<span class="prio">#' + (i + 1) + '</span>' +
        '<span class="ttl">' + esc(t) + '</span>' +
        '<span class="pop-reorder">' +
          '<button class="rowbtn" title="Move up (higher priority)" ' + (i === 0 ? 'disabled' : '') + ' onclick="event.stopPropagation();movePopup(' + i + ',-1)">▲</button>' +
          '<button class="rowbtn" title="Move down (lower priority)" ' + (i === last ? 'disabled' : '') + ' onclick="event.stopPropagation();movePopup(' + i + ',1)">▼</button>' +
        '</span>' +
        '<span class="stat ' + (p.active ? 'on' : 'off') + '">' + (p.active ? 'Active' : 'Off') + '</span>' +
        '</div><div class="item-body">' + body + '</div></div>';
    }
    function collectPopups() {
      var wrap = document.getElementById('cbody');
      var byIndex = {};
      popups.forEach(function (_, i) { byIndex[i] = {}; });
      wrap.querySelectorAll('[data-i]').forEach(function (el) {
        var i = el.getAttribute('data-i'), k = el.getAttribute('data-k');
        byIndex[i][k] = el.type === 'checkbox' ? el.checked : el.value;
      });
      return Object.keys(byIndex).map(function (i) {
        var o = byIndex[i];
        var out = { active: !!o.active, region: (o.region || 'all').trim(), audience: (o.audience || 'all') };
        if (o.url && o.url.trim()) out.url = o.url.trim();
        if (o.title && o.title.trim()) out.title = o.title.trim();
        if (o.text && o.text.trim()) out.text = o.text;
        if (o.button && o.button.trim()) out.button = o.button.trim();
        if (o.video && o.video.trim()) out.video = o.video.trim();
        if (o.gif && o.gif.trim()) out.gif = o.gif.trim();
        var mo = parseInt(o.maxOpens, 10); if (!isNaN(mo) && mo > 0) out.maxOpens = mo;
        if (o.users && o.users.trim()) out.users = o.users.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        if (o.starts && o.starts.trim()) out.starts = o.starts.trim();
        if (o.expires && o.expires.trim()) out.expires = o.expires.trim();
        ['bg', 'border', 'color'].forEach(function (f) { if (o[f] && o[f].trim()) out[f] = o[f].trim(); });
        return out;
      });
    }
    function movePopup(i, dir) {
      popups = collectPopups();
      var j = i + dir;
      if (j < 0 || j >= popups.length) return;
      var t = popups[i]; popups[i] = popups[j]; popups[j] = t;
      drawPopups();
    }
    function addPopup() { popups = collectPopups(); popups.push({ active: true, region: 'all', audience: 'unlicensed', title: '', text: '', button: '', url: '' }); drawPopups(); }
    function delPopup(i) { popups = collectPopups(); popups.splice(i, 1); drawPopups(); }
    function toggleImport() { var el = document.getElementById('popImport'); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
    function importPopups() {
      var ta = document.getElementById('popImportText');
      try {
        var parsed = JSON.parse(ta.value);
        var arr = Array.isArray(parsed) ? parsed : (parsed && parsed.popups);
        if (!Array.isArray(arr)) throw new Error('Expected a "popups" array.');
        popups = arr;
        drawPopups();
        var st = document.getElementById('cStatus');
        if (st) { st.className = 'save-status ok'; st.textContent = 'Loaded ' + arr.length + ' popups — review, then “Save all”.'; }
      } catch (e) { alert('Invalid JSON: ' + e.message); }
    }
    async function savePopups() { await saveFile('bdpopup.json', { popups: collectPopups() }, 'cStatus'); }

    async function saveFile(file, obj, statusId) {
      var st = document.getElementById(statusId); st.className = 'save-status'; st.textContent = 'Saving…';
      try { await api('save_content', { file: file, content: obj }); st.className = 'save-status ok'; st.textContent = 'Saved ✓ (live on next plugin open)'; }
      catch (e) { st.className = 'save-status err'; st.textContent = e.message; }
    }

    // ---------- CSV ----------
    function exportCSV(rows, name) {
      if (!rows || !rows.length) return;
      var cols = Object.keys(rows[0]).filter(function (c) { return c.charAt(0) !== '_'; });
      var csv = [cols.join(',')].concat(rows.map(function (r) {
        return cols.map(function (c) { var v = r[c] == null ? '' : String(r[c]); return '"' + v.replace(/"/g, '""') + '"'; }).join(',');
      })).join('\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = name + '.csv'; a.click();
    }

    (function () {
      var m = document.getElementById('userModal');
      if (m) {
        m.addEventListener('click', function (e) { if (e.target === m) closeUserModal(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && m.classList.contains('open')) closeUserModal(); });
      }
    })();

    if (pw()) { unlock(); }
  </script>
</body>
</html>
